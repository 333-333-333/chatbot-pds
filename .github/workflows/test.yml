name: Run tests and create reports

on:
  push:
    branches:
      - develop
    paths:
        - "chatbot-pds-api/**"
  pull_request:
    branches:
      - develop
    paths:
        - "chatbot-pds-api/**"

jobs:
  test_and_report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --html=test_report/index.html --cov=modules --cov-report=html:coverage_report

      - name: Create zip files of the reports
        run: |
          zip -r test_report.zip test_report/
          zip -r coverage_report.zip coverage_report/

      - name: Upload the reports as artifacts
        uses: actions/upload-artifact@v2
        with:
          name: test-reports
          path: |
            test_report.zip
            coverage_report.zip
